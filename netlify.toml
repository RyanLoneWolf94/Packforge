# Netlify deploy config for Packforge (static Vite SPA).
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  # 22+: @supabase/supabase-js needs a global WebSocket for its realtime
  # client, which Node only ships from 22. On 20 the MCP function threw
  # "native WebSocket not found" on the first query.
  NODE_VERSION = "22"

# SPA fallback: every non-file path is served index.html so client-side
# routing (/admin/*, /portal/:token/*) works on hard refresh and deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the fingerprinted build assets; never cache the HTML shell.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
